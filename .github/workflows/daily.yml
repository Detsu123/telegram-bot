name: Daily AI Tech Digest

on:
  workflow_dispatch:

  schedule:
    # Монголын цагаар өдөр бүр 19:17
    - cron: "17 19 * * *"
      timezone: "Asia/Ulaanbaatar"

permissions:
  contents: write

concurrency:
  group: daily-ai-tech-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect, summarize and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_API_TOKEN: ${{ github.token }}

          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_TIMEOUT_SECONDS: "120"
          LOOKBACK_HOURS: "42"
          MAX_ITEMS_FOR_AI: "32"
          MAX_SUMMARY_ITEMS: "15"

        run: python -u main.py

      - name: Save processed news state
        run: |
          if git diff --quiet -- data/seen_items.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/seen_items.json
          git commit -m "chore: update processed news state"
          git push
